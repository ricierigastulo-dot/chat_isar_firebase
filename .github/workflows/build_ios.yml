name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      # Compilación oficial de Flutter inyectando tolerancia a flags desconocidas
      - name: Compilar iOS (No-codesign)
        env:
          OTHER_CFLAGS: "-Wno-error=unused-command-line-argument -Qunused-arguments"
          OTHER_CPLUSPLUSFLAGS: "-Wno-error=unused-command-line-argument -Qunused-arguments"
        run: flutter build ios --release --no-codesign

      - name: Crear paquete .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa