name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      # PASO CLAVE: Elimina el flag '-G' directo de las fuentes de isar_flutter_libs en pub-cache
      - name: Corregir flag -G en Isar
        run: |
          ISAR_PODSPEC=$(find ~/.pub-cache -name "isar_flutter_libs.podspec" 2>/dev/null | head -n 1)
          if [ -n "$ISAR_PODSPEC" ]; then
            echo "Encontrado podspec de Isar en: $ISAR_PODSPEC"
            sed -i '' 's/-G//g' "$ISAR_PODSPEC"
          fi

      - name: Compilar iOS (No-codesign)
        run: flutter build ios --release --no-codesign

      - name: Crear paquete .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa