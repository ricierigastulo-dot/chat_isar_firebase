name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      # Inyectamos -Qunused-arguments a xcodebuild para que ignore el flag -G no soportado
      - name: Compilar iOS (No-codesign)
        run: |
          flutter build ios --release --no-codesign \
            --extra-front-end-options="--enable-experiment=non-nullable" \
            --script-snapshot \
            || flutter build ios --release --no-codesign --config-only

      - name: Compilar con Xcode ignorando banderas invalidas
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CFLAGS="$(inherited) -Wno-error=unused-command-line-argument -Qunused-arguments" \
            OTHER_CPLUSPLUSFLAGS="$(inherited) -Wno-error=unused-command-line-argument -Qunused-arguments"

      - name: Crear paquete .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Runner.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa