name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      # Regenera enlaces y la carpeta ios/Flutter/podhelper.rb
      - name: Regenerar enlaces nativos de iOS
        run: flutter create . --platforms=ios

      # Reinstala los pods aplicando nuestro Podfile (con iOS 13.0 forzado)
      - name: Actualizar e Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Compilar iOS (No-codesign)
        run: flutter build ios --release --no-codesign

      - name: Crear paquete .ipa
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa