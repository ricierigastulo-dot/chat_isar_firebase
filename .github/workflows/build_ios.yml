name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main       # Se ejecuta automáticamente al hacer push a 'main'
      - master     # o 'master' (ajusta según el nombre de tu rama)
  workflow_dispatch: # Permite ejecutar el proceso manualmente desde GitHub

jobs:
  build-ios:
    runs-on: macos-latest # Utiliza máquinas con macOS de GitHub

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Java (Requerido por algunas herramientas de Flutter)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Instalar y configurar Flutter SDK
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # 4. Descargar dependencias del pubspec.yaml
      - name: Obtener dependencias de Flutter
        run: flutter pub get

      # 5. Compilar la aplicación para iOS (Modo no firmado para pruebas o desarrollo)
      - name: Compilar iOS (No-codesign)
        run: flutter build ios --release --no-codesign

      # 6. Empaquetar la app en formato .ipa comprimido
      - name: Crear paquete .ipa / Runner.app
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      # 7. Subir el ejecutable .ipa como Artefacto descargable
      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa