name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # PASO CLAVE 1: Desarmar la bandera -G globalmente en la VM
      - name: Purga Global de bandera -G en el Runner
        run: |
          echo "Limpiando referencias -G del sistema..."
          find ~/.pub-cache /Users/runner/hostedtoolcache -type f \( -name "*.pbxproj" -o -name "*.xcconfig" -o -name "*.modulemap" -o -name "*.json" \) -exec sed -i '' 's/-G[0-9]*//g' {} + || true

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      # PASO CLAVE 2: Limpieza de Pods y de FlutterGeneratedPluginSwiftPackage
      - name: Sanitizar iOS Workspace y Swift Packages
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks Flutter/ephemeral
          pod install --repo-update
          find . -type f \( -name "*.pbxproj" -o -name "*.xcconfig" -o -name "*.modulemap" -o -name "*.plist" \) -exec sed -i '' 's/-G[0-9]*//g' {} + || true
          cd ..

      # PASO CLAVE 3: Compilación directa desactivando la bandera -G en xcodebuild
      - name: Compilar iOS (No-codesign)
        run: |
          flutter build ios --release --no-codesign --extra-front-end-options="--no-defines"

      - name: Crear paquete .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa