name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      - name: Sanitizar y Regenerar Pods de iOS
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          
          # Limpiar -G en todos los archivos del proyecto y pods generados
          find . -type f \( -name "*.pbxproj" -o -name "*.xcconfig" -o -name "*.plist" \) -exec sed -i '' 's/-G[0-9]*//g' {} + || true
          cd ..

      - name: Compilar iOS con Override de Banderas C/C++
        env:
          # Sobreescribir banderas del sistema eliminando -G
          CFLAGS: "-Wno-error"
          CXXFLAGS: "-Wno-error"
          OTHER_CFLAGS: ""
          OTHER_CPLUSPLUSFLAGS: ""
        run: |
          flutter build ios --release --no-codesign --extra-front-end-options="--no-defines" || \
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO OTHER_CFLAGS="" OTHER_CPLUSPLUSFLAGS="" build

      - name: Crear paquete .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa