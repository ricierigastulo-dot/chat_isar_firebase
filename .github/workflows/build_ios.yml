name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Desactivar Swift Package Manager en Flutter
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      - name: Preparar Pods de iOS
        run: |
          cd ios
          rm -rf Pods Podfile.lock Flutter/ephemeral
          pod install --repo-update
          cd ..

      - name: Compilar iOS (No-codesign)
        run: flutter build ios --release --no-codesign

      - name: Crear paquete .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa