name: Compilar Flutter para iOS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      - name: Limpiar banderas obsoletas (-G) de Xcode y Pods
        run: |
          find . -type f \( -name "*.pbxproj" -o -name "*.xcconfig" \) -exec sed -i '' 's/-G[0-9]*//g' {} + || true

      - name: Instalar y Actualizar Pods
        run: |
          cd ios
          pod install --repo-update
          find . -type f \( -name "*.pbxproj" -o -name "*.xcconfig" \) -exec sed -i '' 's/-G[0-9]*//g' {} + || true
          cd ..

      - name: Compilar iOS (No-codesign)
        run: flutter build ios --release --no-codesign

      - name: Crear paquete .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Subir artefacto IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-iOS-Runner
          path: build/ios/iphoneos/Runner.ipa